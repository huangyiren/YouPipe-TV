name: Build Chinese APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: Auto Format Dart Code
        working-directory: android
        run: dart format -l 120 lib test

      - name: Commit Formatted Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add android/lib android/test
          git diff --staged --quiet || (git commit -m "Auto format code" && git push)

      - name: Build APK
        working-directory: android
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: cp android/build/app/outputs/flutter-apk/app-release.apk YouPipe-TV-v1.0.6-zh-TW.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6-zh
          name: YouPipe TV 繁體中文版 v1.0.6
          body: 支援繁體中文介面、台灣地區與系統中文／語音輸入。
          files: YouPipe-TV-v1.0.6-zh-TW.apk
