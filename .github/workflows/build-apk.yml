name: Build Chinese APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: Restore and Patch watch.dart
        run: |
          ORIG_COMMIT=$(git log --format=%H -- android/lib/screens/watch.dart | tail -n 1)
          git checkout "$ORIG_COMMIT" -- android/lib/screens/watch.dart
          python3 -c '
          p = "android/lib/screens/watch.dart"
          s = open(p).read()
          target = "if (k == LogicalKeyboardKey.arrowUp && _bar.hasFocus) {"
          patch = """if (k == LogicalKeyboardKey.arrowDown && _bar.hasFocus) {
                _playButton.requestFocus();
                return KeyEventResult.handled;
              }
              if (k == LogicalKeyboardKey.arrowUp && !_bar.hasFocus && !_upNextFocused) {
                if (FocusManager.instance.primaryFocus?.focusInDirection(TraversalDirection.up) != true) {
                  _bar.requestFocus();
                }
                return KeyEventResult.handled;
              }
              """ + target
          assert target in s, "Target line not found"
          s = s.replace(target, patch, 1)
          subs = [
              ("Resuming from ", "繼續播放位置 "),
              ("Skipped ${s.category.label.toLowerCase()}", "已略過贊助片段"),
              ("Couldn\x27t load captions", "無法載入字幕"),
              ("No captions for this video", "此影片沒有提供字幕"),
              ("title: \x27Captions\x27", "title: \x27字幕\x27"),
              ("PanelItem(\x27Off\x27", "PanelItem(\x27關閉\x27"),
              ("title: \x27Settings\x27", "title: \x27播放設定\x27"),
              ("\x27Quality\x27", "\x27畫質\x27"),
              ("\x27Playback speed\x27", "\x27播放速度\x27"),
              ("\x27Normal\x27", "\x27正常\x27"),
              ("\x27Captions\x27", "\x27字幕\x27"),
              ("\x27Autoplay\x27", "\x27自動播放\x27"),
              ("? \x27On\x27 : \x27Off\x27", "? \x27開啟\x27 : \x27關閉\x27"),
              ("_PanelHeading(\x27Chapters\x27)", "_PanelHeading(\x27章節\x27)"),
              ("_PanelHeading(\x27Description\x27)", "_PanelHeading(\x27資訊欄\x27)"),
              ("[\x27No description\x27]", "[\x27無影片說明\x27]"),
              ("title: \x27Comments\x27", "title: \x27留言\x27"),
              ("Couldn\x27t play this video. ", "無法播放此影片。"),
              (" subscribers\x27", " 位訂閱者\x27"),
              (" watching\x27", " 人正在觀看\x27"),
              ("live ? \x27LIVE\x27", "live ? \x27直播\x27"),
              ("Up next in ", "接下來播放："),
              ("\x27this playlist\x27", "\x27此播放清單\x27"),
              (": \x27Up next\x27", ": \x27接下來播放\x27"),
              (": \x27Like\x27", ": \x27喜歡\x27"),
              ("\x27Added to Liked videos\x27", "\x27已加入喜歡的影片\x27"),
              ("\x27Removed from Liked videos\x27", "\x27已從喜歡的影片移除\x27"),
              ("\x27Estimated by Return YouTube Dislike\x27", "\x27資料來自 Return YouTube Dislike 預估\x27"),
              ("? \x27Saved\x27 : \x27Save\x27", "? \x27已儲存\x27 : \x27稍後觀看\x27"),
              ("\x27Saved to Watch later\x27", "\x27已儲存至稍後觀看\x27"),
              ("\x27Removed from Watch later\x27", "\x27已從稍後觀看移除\x27"),
              ("? \x27Subscribed\x27 : \x27Subscribe\x27", "? \x27已訂閱\x27 : \x27訂閱\x27"),
              ("Up next in ${_countdown ?? 0}", "${_countdown ?? 0} 秒後播放下一部影片"),
              ("OK plays it now • Back cancels", "按確認鍵立即播放 • 按返回鍵取消"),
              ("\x27Loading…\x27 : \x27No comments\x27", "\x27載入留言中…\x27 : \x27目前沒有留言\x27"),
              (" replies\x27", " 則回覆\x27"),
          ]
          for a, b in subs:
              s = s.replace(a, b)
          open(p, "w").write(s)
          '

      - name: Auto Format Dart Code
        working-directory: android
        run: dart format -l 120 lib test

      - name: Commit Formatted Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add android/lib android/test
          git diff --staged --quiet || (git commit -m "Restore and translate watch.dart" && git push)

      - name: Build APK
        working-directory: android
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: cp android/build/app/outputs/flutter-apk/app-release.apk YouPipe-TV-v1.0.6-zh-TW.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6-zh
          name: YouPipe TV 繁體中文版 v1.0.6
          body: 支援繁體中文介面、台灣地區、系統中文／語音輸入與完整遙控器焦點導航。
          files: YouPipe-TV-v1.0.6-zh-TW.apk
